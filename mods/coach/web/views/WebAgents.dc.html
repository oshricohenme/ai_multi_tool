<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subagents view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="height: 100%; min-height: 844px; display: flex; flex-direction: column; background: #0b0b0d; color: #e4e4e8; font-family: Inter, system-ui, sans-serif; font-size: 13px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 16px 20px 12px; border-bottom: 1px solid #1f1f23; background: linear-gradient(#111114, #0d0d10)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 18px; font-weight: 600">Subagents</h1>
<p style="margin: 0; color: #9a9aa3">Where the work went, and what the subagents kept out of your main context.</p>
</div>
<div style="display: flex; gap: 22px; flex-wrap: wrap">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11px; color: #8b8b94">{{k.label}}</span><span style="{{k.style}}">{{k.value}}</span></div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 10px 20px">
<span style="font-size: 12px; color: #8b8b94">{{crumb}}</span>
<div role="group" aria-label="Size by" style="display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: #151518; border: 1px solid #222227">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button></sc-for>
</div>
</div>
<canvas ref="{{iceRef}}" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" onClick="{{onClick}}" aria-label="Icicle chart of the session: main thread and each subagent, down to single calls and tools. Click to zoom." style="display: block; width: 100%; height: 300px; cursor: pointer"></canvas>

<div style="display: flex; flex-wrap: wrap; flex: 1; min-height: 0; border-top: 1px solid #1f1f23">
<section style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #1f1f23">
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 12px 20px 0"><span style="font-weight: 600">Read vs returned</span><span style="font-size: 12px; color: #8b8b94">each dot is ~1.2k tokens · only the bright ones reach your context</span></div>
<canvas ref="{{funnelRef}}" aria-label="Funnel per subagent: tokens it read on the left, tokens it returned to the main thread on the right" style="display: block; width: 100%; flex: 1; min-height: 300px"></canvas>
</section>
<section style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 12px 20px 0"><span style="font-weight: 600">Main context: actual vs done inline</span><span style="{{cfStyle}}">{{cfNote}}</span></div>
<canvas ref="{{cfRef}}" aria-label="Main thread context over time, and what it would have been had the subagents' reads happened in the main thread" style="display: block; width: 100%; flex: 1; min-height: 300px"></canvas>
</section>
</div>
</div>
</x-dc>

      crumb: path.join('  ›  ') + (S.focus === 'root' ? '  ·  click a block to zoom' : '  ·  click the top bar to zoom out'),
      modes: [['tok', 'Tokens'], ['sec', 'Time'], ['usd', 'Cost']].map(function (x) {
        var on = S.mode === x[0];
        return { label: x[1], on: on ? 'true' : 'false', pick: function () { self.setState({ mode: x[0] }); }, style: 'height: 28px; padding: 0 12px; border: 0; border-radius: 6px; cursor: pointer; background: ' + (on ? '#2a2a31' : 'transparent') + '; color: ' + (on ? C.focus : C.dim) };
      }),
      iceRef: function (el) { self.ice = el; }, funnelRef: function (el) { self.funnel = el; }, cfRef: function (el) { self.cf = el; },
      onMove: function (ev) { var n = at(ev), id = n ? n.id : null; if (id !== S.hover) self.setState({ hover: id }); },
      onLeave: function () { self.mouse = null; self.setState({ hover: null }); },
      onClick: function (ev) {
        var n = at(ev); if (!n) return;
        var target = n.id === S.focus ? (n.parent || ROOT) : n.kids.length ? n : n.parent;
        self.setState({ focus: target.id });
      },
      cfNote: !AGENTS.length ? 'no subagents yet' : CROSS !== null ? 'subagents kept ' + fk(read - ret) + ' out · inline would have auto-compacted' : 'subagents kept ' + fk(read - ret) + ' out of your context',
      cfStyle: 'font-size: 12px; color: ' + C.relief
    };
  }
}
