<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habits view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
input[type=range]{accent-color:#e2a557}
</style>
</helmet>
<div style="height: 100%; min-height: 844px; display: flex; flex-direction: column; background: #0b0b0d; color: #e4e4e8; font-family: Inter, system-ui, sans-serif; font-size: 13px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 16px 20px 12px; border-bottom: 1px solid #1f1f23; background: linear-gradient(#111114, #0d0d10)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 18px; font-weight: 600">Habits &amp; settings</h1>
<p style="margin: 0; color: #9a9aa3">{{intro}}</p>
</div>
<span style="font-size: 12px; color: #8b8b94">kept in ~/.claude/dev-tools · nothing leaves this machine</span>
</div>

<div style="display: flex; flex-wrap: wrap; border-bottom: 1px solid #1f1f23">
<canvas ref="{{trendRef}}" onMouseMove="{{onTrend}}" onMouseLeave="{{offTrend}}" aria-label="Four trends over the last 14 sessions: cost per turn, cache hit rate, context at compaction, tokens via subagents" style="{{trendStyle}}"></canvas>
<div style="flex: 1 1 340px; max-width: 440px; display: flex; flex-direction: column; border-left: 1px solid #1f1f23; background: #101013">
<canvas ref="{{radarRef}}" aria-label="Radar of six habit scores for the selected session against your median" style="display: block; width: 100%; height: 250px"></canvas>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 18px 14px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{sess.name}}</span><span style="font-family: 'JetBrains Mono', monospace; color: #9a9aa3">{{sess.cost}}</span></div>
<span style="font-size: 12px; color: #9a9aa3; line-height: 1.45">{{sess.note}}</span>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; flex: 1; min-height: 0">
<section style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 12px 20px 4px">
<div role="tablist" style="display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: #151518; border: 1px solid #222227">
<sc-for list="{{guards}}" as="gd" hint-placeholder-count="3"><button type="button" role="tab" onClick="{{gd.pick}}" aria-selected="{{gd.on}}" style="{{gd.style}}">{{gd.label}}</button></sc-for>
</div>
<label style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #9a9aa3">{{tune.label}}
<input type="range" min="{{tune.min}}" max="{{tune.max}}" step="{{tune.step}}" value="{{tune.value}}" onChange="{{tune.onChange}}" aria-label="{{tune.label}}" style="width: 220px">
<span style="min-width: 64px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #e4e4e8">{{tune.shown}}</span>
</label>
</div>
<canvas ref="{{tuneRef}}" aria-label="Histogram of past values with the guard threshold" style="display: block; width: 100%; flex: 1; min-height: 210px"></canvas>
</section>
<aside style="flex: 1 1 340px; max-width: 440px; border-left: 1px solid #1f1f23; display: flex; flex-direction: column; gap: 10px; padding: 16px 18px">
<span style="font-size: 11px; letter-spacing: 0.08em; color: #6e6e78">{{nLabel}}</span>
<sc-for list="{{tune.stats}}" as="s" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid #1a1a1e"><span style="color: #c4c4cb">{{s.k}}</span><span style="{{s.style}}">{{s.v}}</span></div>
</sc-for>
<p style="margin: 0; font-size: 12px; line-height: 1.55; color: #9a9aa3">{{tune.advice}}</p>
</aside>
</div>
</div>
</x-dc>

      onTrend: scrub, offTrend: function () { self.setState({ hi: LASTI }); },
      nLabel: 'AT THIS SETTING, LAST ' + NS + ' SESSION' + (NS > 1 ? 'S' : ''),
      sess: { name: SESS[hi0] || '', cost: DT.fmt.usd(cost / 100) + ' / turn', note: NOTES[hi0] || '' },
      guards: Object.keys(GUARDS).map(function (k) {
        var on = S.guard === k;
        return { label: GUARDS[k].label, on: on ? 'true' : 'false', pick: function () { self.setState({ guard: k }); }, style: 'height: 28px; padding: 0 12px; border: 0; border-radius: 6px; cursor: pointer; background: ' + (on ? '#2a2a31' : 'transparent') + '; color: ' + (on ? C.focus : C.dim) };
      }),
      tune: {
        label: G.set, min: String(G.min), max: String(G.max), step: String(G.step), value: String(v), shown: G.show(v),
        onChange: function (ev) { var o = Object.assign({}, S.vals); o[S.guard] = Number(ev.target.value); self.setState({ vals: o }); },
        stats: G.stats(v, data).map(function (x, i) { return { k: x[0], v: x[1], style: mono + (i === 0 ? C.hot : i === 1 ? C.relief : C.text) }; }),
        advice: G.advice(v, data)
      }
    };
  }
}
