# Validate the marketplace and the plugin, syntax-check its scripts, and run its tests.
name: validate-plugins

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate token-accounting-statement
      - run: node --check token-accounting-statement/bin/statement.mjs && node --check token-accounting-statement/bin/account.mjs && node --check token-accounting-statement/bin/render.mjs
      - run: node --test token-accounting-statement/test/statement.test.mjs
      - run: claude plugin test token-accounting-statement
