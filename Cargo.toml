[package]
name = "mt"
version = "0.1.0"
edition = "2024"
description = "A context engine for coding agents: one call to read everything related to a symbol, one checked call to change it"
license = "MIT"
readme = "README.md"
repository = "https://github.com/oshricohenme/ai_multi_tool"

[dependencies]
# pure-Rust BERT embeddings for `mt tools` (CPU only, no C/C++); off unless built with --features bert
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
ignore = "0.4.34"
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
notify = "8.2.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_path = "0.7.2"
similar = "3.2.1"
streaming-iterator = "0.1.9"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.3.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.24.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-php = "0.25.1"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.4"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

[features]
bert = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
